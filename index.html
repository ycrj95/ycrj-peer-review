<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peer Review Tool — YCRJ and Associates</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F4F3EF; --surface:#FFFFFF; --surface2:#F0EFE9; --surface3:#E8E6DE;
  --border:#E0DED6; --border2:#C8C6BC;
  --text:#1A1916; --text2:#5C5B56; --text3:#9B9990;
  --accent:#1B4F8A; --accent-bg:#EAF0F8; --accent-border:#BDD0E8;
  --green:#276B34; --green-bg:#E8F4EB; --green-border:#A3CEA9;
  --red:#A82828; --red-bg:#FAE8E8; --red-border:#E8AAAA;
  --amber:#7A4F00; --amber-bg:#FDF3E0; --amber-border:#E8C97A;
  --r:10px; --r-sm:6px; --r-xs:4px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.hidden{display:none!important}
input,select,button,textarea{font-family:'DM Sans',sans-serif}

/* LOGIN */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:var(--bg);
  background-image:radial-gradient(ellipse at 15% 60%,rgba(27,79,138,.05) 0%,transparent 55%),
                   radial-gradient(ellipse at 85% 20%,rgba(39,107,52,.04) 0%,transparent 50%)}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2.25rem;width:100%;max-width:400px;box-shadow:var(--shadow-md)}
.lbrand{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.lmark{width:38px;height:38px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.lfirm{font-size:15px;font-weight:600;line-height:1.2}
.lsub{font-size:11px;color:var(--text3);margin-top:1px}
.ltitle{font-size:22px;font-weight:600;margin-bottom:3px}
.ldesc{font-size:13px;color:var(--text2);margin-bottom:1.75rem}
.ltabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--surface2);padding:4px;border-radius:var(--r-sm)}
.ltab{flex:1;padding:7px;border:none;border-radius:var(--r-xs);font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s}
.ltab.on{background:var(--accent);color:#fff}
.lfield{margin-bottom:1rem}
.lfield label{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.lfield input,.lfield select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:14px;transition:border-color .15s}
.lfield input:focus,.lfield select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,79,138,.08)}
.lbtn{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;margin-top:.5rem;transition:background .15s}
.lbtn:hover{background:#153d6d}
.lerr{font-size:12px;color:var(--red);margin-top:8px;display:none}
.lfooter{font-size:11px;color:var(--text3);text-align:center;margin-top:1.25rem}

/* SHELL */
#appShell{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.tbrand{display:flex;align-items:center;gap:10px}
.tmark{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.tname{font-size:14px;font-weight:600}
.tsub{font-size:11px;color:var(--text3)}
.tnav{display:flex;gap:2px}
.ntab{padding:6px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .15s}
.ntab:hover{background:var(--surface2);color:var(--text)}
.ntab.on{background:var(--accent-bg);color:var(--accent)}
.tright{display:flex;align-items:center;gap:10px}
.syncpill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sdot.spin{animation:blink 1s infinite;background:var(--amber)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.uchip{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface2);border-radius:20px;font-size:12px;font-weight:500}
.uav{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rpip{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}
.rpip.admin{background:var(--accent-bg);color:var(--accent)}
.rpip.staff{background:var(--green-bg);color:var(--green)}
.tlogout{font-size:12px;color:var(--text3);cursor:pointer;border:1px solid var(--border);background:transparent;padding:5px 10px;border-radius:var(--r-sm);transition:all .15s}
.tlogout:hover{background:var(--surface2);color:var(--text)}
.main{flex:1;padding:1.5rem;max-width:1440px;margin:0 auto;width:100%}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:#153d6d}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{background:#1e5228}
.btn-sm{padding:5px 10px;font-size:12px}

/* METRICS */
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;box-shadow:var(--shadow)}
.mlabel{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.mval{font-size:30px;font-weight:700;line-height:1;font-family:'DM Mono',monospace}
.mval.blue{color:var(--accent)}.mval.green{color:var(--green)}.mval.red{color:var(--red)}.mval.amber{color:var(--amber)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.25rem}
.chead{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ctitle{font-size:14px;font-weight:600}
.csub{font-size:12px;color:var(--text3)}

/* TABLES */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr.clickable:hover{background:var(--surface2);cursor:pointer}
tbody td{padding:8px 10px;vertical-align:middle}
.tmono{font-family:'DM Mono',monospace;font-size:11px}
.tclip{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-pending{background:var(--red-bg);color:var(--red)}
.b-progress{background:var(--amber-bg);color:var(--amber)}
.b-complete{background:var(--green-bg);color:var(--green)}

/* FILTERS */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.875rem 1.25rem;display:flex;gap:.75rem;align-items:flex-end;margin-bottom:1.25rem;flex-wrap:wrap;box-shadow:var(--shadow)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.fg select,.fg input[type=text]{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:13px;min-width:140px}
.fg select:focus,.fg input:focus{outline:none;border-color:var(--accent)}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:8px}
.prog-bg{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:60px}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.prog-val{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;min-width:36px;text-align:right;color:var(--text2)}

/* SEND BAR */
.sendbar{background:linear-gradient(135deg,var(--accent-bg),#f4f8fd);border:1px solid var(--accent-border);border-radius:var(--r);padding:1.125rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.sbinfo h3{font-size:14px;font-weight:600;color:var(--accent)}
.sbinfo p{font-size:12px;color:var(--text2);margin-top:2px}
.slog{margin-top:10px;font-size:12px;padding:10px 14px;border-radius:var(--r-sm);display:none;line-height:1.7}
.slog.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.slog.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

/* SYNC BAR */
.syncbar{background:linear-gradient(135deg,#f0f5f0,#f8faf8);border:1px solid var(--green-border);border-radius:var(--r);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.syncinfo h3{font-size:14px;font-weight:600;color:var(--green)}
.syncinfo p{font-size:12px;color:var(--text2);margin-top:2px}
.synclog{margin-top:10px;font-size:12px;padding:10px 14px;border-radius:var(--r-sm);display:none;font-family:'DM Mono',monospace;line-height:1.7}
.synclog.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.synclog.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

/* CHECKLIST */
.clpanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-top:1rem;box-shadow:var(--shadow-md);animation:slideDown .2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.clhead{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--surface2),var(--surface));border-radius:var(--r) var(--r) 0 0}
.clhinfo h3{font-size:15px;font-weight:600}
.clhinfo p{font-size:12px;color:var(--text2);margin-top:3px}
.clpct{display:flex;align-items:center;gap:10px}
.clpbar{width:150px;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.clpfill{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.clpnum{font-size:14px;font-weight:700;font-family:'DM Mono',monospace;min-width:40px;text-align:right}
.cldetails{background:var(--accent-bg);border-bottom:1px solid var(--accent-border);padding:.875rem 1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
.cldetail-item label{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.cldetail-item span{font-size:13px;font-weight:500;color:var(--text)}
.clbody{padding:1.25rem}
.clsect{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.clsect::after{content:'';flex:1;height:1px;background:var(--border)}
.fingrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.ffield label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.ffield input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--text);background:var(--surface);transition:border-color .15s;font-family:'DM Mono',monospace}
.ffield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,79,138,.06)}
.clitems{display:flex;flex-direction:column}
.clitem{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.clitem:last-child{border-bottom:none}
.clinum{font-size:11px;color:var(--text3);width:22px;text-align:right;font-family:'DM Mono',monospace;flex-shrink:0}
.cliname{flex:1;font-size:13px;line-height:1.4}
.clibtns{display:flex;gap:4px;flex-shrink:0}
.mbtn{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text3);transition:all .15s}
.mbtn:hover{border-color:var(--border2);color:var(--text2)}
.mbtn.yes.on{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.mbtn.no.on{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.mbtn.na.on{background:var(--surface2);color:var(--text2);border-color:var(--border2)}
.clfooter{padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:0 0 var(--r) var(--r)}
.clfoot-left{font-size:12px;color:var(--text3)}
.clfoot-right{display:flex;gap:8px}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;border-top:1px solid var(--border);font-size:13px}

/* SETUP */
.setup-field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.setup-field input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;background:var(--surface);color:var(--text);font-family:'DM Mono',monospace}
.cred-table{width:100%;border-collapse:collapse;font-size:13px}
.cred-table th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface2)}
.cred-table td{padding:9px 12px;border-bottom:1px solid var(--border)}
.cred-table tr:last-child td{border-bottom:none}
.pwdchip{font-family:'DM Mono',monospace;font-size:12px;background:var(--surface2);padding:2px 7px;border-radius:4px;border:1px solid var(--border)}
.step-list{list-style:none;counter-reset:steps}
.step-list li{counter-increment:steps;display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;font-size:13px;color:var(--text2)}
.step-list li::before{content:counter(steps);min-width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.msgbox{margin-top:10px;font-size:13px;padding:8px 12px;border-radius:var(--r-sm);display:none}
.msgbox.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.msgbox.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateY(0)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div>
    <div class="lcard">
      <div class="lbrand">
        <div class="lmark">YR</div>
        <div><div class="lfirm">YCRJ and Associates</div><div class="lsub">Chartered Accountants · Bangalore</div></div>
      </div>
      <div class="ltitle">Sign In</div>
      <div class="ldesc">Access the Peer Review Management System</div>
      <div class="ltabs">
        <button class="ltab on" id="staffTabBtn" onclick="switchTab('staff')">Staff Login</button>
        <button class="ltab" id="adminTabBtn" onclick="switchTab('admin')">Admin Login</button>
      </div>
      <!-- Staff Login -->
      <div id="staffFields">
        <div class="lfield">
          <label>Your Name</label>
          <input type="text" id="staffName" list="staffDatalist" placeholder="Type or select your name..." autocomplete="off"
            style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:14px">
          <datalist id="staffDatalist"></datalist>
        </div>
        <div class="lfield"><label>Password</label><input type="password" id="staffPwd" placeholder="Enter your password"></div>
      </div>
      <!-- Admin Login -->
      <div id="adminFields" style="display:none">
        <div class="lfield"><label>Username</label><input type="text" id="adminUser" placeholder="Enter username" autocomplete="username"></div>
        <div class="lfield"><label>Password</label><input type="password" id="adminPwd" placeholder="Enter password"></div>
      </div>
      <div class="lerr" id="lerr">Invalid credentials. Please try again.</div>
      <button class="lbtn" onclick="doLogin()">Sign In →</button>
    </div>
    <div class="lfooter">YCRJ Peer Review System · v3.0 · Deadline: 30 Jun 2026</div>
  </div>
</div>

<!-- APP -->
<div id="appShell">
  <div class="topbar">
    <div class="tbrand">
      <div class="tmark">YR</div>
      <div><div class="tname">YCRJ Peer Review</div><div class="tsub">UDIN Checklist Management</div></div>
    </div>
    <div class="tnav" id="tnav"></div>
    <div class="tright">
      <div class="syncpill"><div class="sdot" id="sdot"></div><span id="slabel">Loading...</span></div>
      <div class="uchip"><div class="uav" id="uav"></div><span id="uname"></span><span class="rpip" id="rpip"></span></div>
      <button class="tlogout" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main" id="mainArea"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
// ══════════════════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════════════════
const CFG = {
  firm: 'YCRJ and Associates',
  sender: 'info@ycrjca.com',
  github: 'https://ycrj95.github.io/ycrj-peer-review',
  appsScriptUrl: 'https://script.google.com/macros/s/AKfycbxNBZ5dT3elp8U17mriI8S09w3tXgFnTEYW4weirytBNsZoYuRe7s38dqugOxzO3fz6/exec',
  reviewDataUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqvLveYtNkpldv0FaBjnJ9sRkZ3_J44bheWF2E6kYo2BAkrszV02iKQgWQLDbw79wVDjMPMcT2W24G/pub?gid=1129971845&single=true&output=csv',

  // Partner tab CSV URLs
  partnerSheets: {
    'Chaitra Raj':          'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqvLveYtNkpldv0FaBjnJ9sRkZ3_J44bheWF2E6kYo2BAkrszV02iKQgWQLDbw79wVDjMPMcT2W24G/pub?gid=545283420&single=true&output=csv',
    'Chandrasekhara Shetty':'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqvLveYtNkpldv0FaBjnJ9sRkZ3_J44bheWF2E6kYo2BAkrszV02iKQgWQLDbw79wVDjMPMcT2W24G/pub?gid=482766523&single=true&output=csv',

window.addEventListener('load', () => {
  // Clear any old cache from previous tool versions
  ['ycrj_cache_udins','ycrj_cache_staff','ycrj_cache_cl','ycrj_cache_partners',
   'ycrj_cache_udins_all','ycrj_review','ycrj_audit'].forEach(k => {
    try { localStorage.removeItem(k); } catch(e) {}
  });

  // Load persisted config
  try {
    const asUrl = localStorage.getItem('ycrj_asurl');
    if (asUrl) CFG.appsScriptUrl = asUrl;
    const rdUrl = localStorage.getItem('ycrj_rdurl');
    if (rdUrl) CFG.reviewDataUrl = rdUrl;
  } catch(e) {}

  // Load cached data
  try {
    const rd = localStorage.getItem('ycrj_rd'); if (rd) RD = JSON.parse(rd);
    const al = localStorage.getItem('ycrj_al'); if (al) AUDIT = JSON.parse(al);
    const st = localStorage.getItem('ycrj_staff'); if (st) { STAFF_LIST = JSON.parse(st); populateStaffList(); }
    const cl = localStorage.getItem('ycrj_cl'); if (cl) { const c = JSON.parse(cl); CHECKLISTS = c.cl||{}; TAG_NAMES = c.tn||{}; }
    const pt = localStorage.getItem('ycrj_partners'); if (pt) PARTNERS = JSON.parse(pt);
  } catch(e) {}

  // Fetch fresh data in background
  fetchStaffList();
  fetchChecklists();
  fetchPartners();

  // Restore session
  try {
    const s = localStorage.getItem('ycrj_session');
    if (s) {
      const sess = JSON.parse(s);
      if (sess.role === 'admin') {
        const adminUser = { username: 'admin', name: 'Admin', role: 'admin' };
        CU = adminUser; launchApp(adminUser); return;
      }
      if (sess.role === 'staff' && sess.name) {
        const user = { username: sess.username, name: sess.name, role: 'staff', partner: sess.partner, password: sess.password };
        CU = user; launchApp(user); return;
      }
    }
  } catch(e) {}
  document.getElementById('loginPage').style.display = 'flex';
});

function switchTab(mode) {
  loginMode = mode;
  document.getElementById('staffFields').style.display = mode === 'staff' ? 'block' : 'none';
  document.getElementById('adminFields').style.display  = mode === 'admin' ? 'block' : 'none';
  document.getElementById('staffTabBtn').className = 'ltab' + (mode === 'staff' ? ' on' : '');
  document.getElementById('adminTabBtn').className = 'ltab' + (mode === 'admin' ? ' on' : '');
  document.getElementById('lerr').style.display = 'none';
}

function populateStaffList() {
  const dl = document.getElementById('staffDatalist');
  if (!dl) return;
  dl.innerHTML = STAFF_LIST.map(s => `<option value="${s.name}">`).join('');
}

function doLogin() {
  document.getElementById('lerr').style.display = 'none';

  if (loginMode === 'admin') {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPwd').value;
    if (!u || !p) { showErr('Please enter username and password.'); return; }
    if (u !== ADMIN_USERNAME) { showErr('Invalid credentials.'); return; }
    if (!CFG.appsScriptUrl) { showErr('System not configured. Contact administrator.'); return; }
    // Verify via Apps Script
    const btn = document.querySelector('.lbtn');
    btn.textContent = 'Verifying...'; btn.disabled = true;
    fetch(CFG.appsScriptUrl, {
      method: 'POST',
      body: JSON.stringify({ type: 'verify_admin', username: u, password: p }),
      headers: { 'Content-Type': 'text/plain' }
    })
    .then(r => r.json())
    .then(res => {
      btn.textContent = 'Sign In →'; btn.disabled = false;
      if (res.status === 'ok') {
        const adminUser = { username: 'admin', name: 'Admin', role: 'admin' };
        CU = adminUser;
        saveSession(adminUser);
        launchApp(adminUser);
      } else {
        showErr('Invalid credentials. Please try again.');
      }
    })
    .catch(() => {
      btn.textContent = 'Sign In →'; btn.disabled = false;
      showErr('Verification failed. Please try again.');
    });
    return;
  }

  // Staff login
  const selVal   = (document.getElementById('staffName').value||'').trim();
  const staffPwd = document.getElementById('staffPwd').value;
  const staff     = STAFF_LIST.find(s => s.name === selVal || s.name.toLowerCase() === selVal.toLowerCase());
  if (!staff)      { showErr('Staff not found. Please select your name.'); return; }
  if (staffPwd !== staff.password) { showErr('Invalid password. Please try again.'); return; }
  const user = { username: staff.name.replace(/\s+/g,'').toLowerCase(), name: staff.name, role: 'staff', partner: staff.partner, password: staff.password };
  CU = user;
  saveSession(user);
  launchApp(user);
}

function showErr(msg) {
  const el = document.getElementById('lerr');
  el.textContent = msg; el.style.display = 'block';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') doLogin();
});

function saveSession(user) {
  try { localStorage.setItem('ycrj_session', JSON.stringify({ username: user.username, name: user.name, role: user.role, partner: user.partner, password: user.password })); } catch(e) {}
}

function doLogout() {
  CU = null;
  UDINS = []; ALL_UDINS = {};
  try { localStorage.removeItem('ycrj_session'); } catch(e) {}
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';

  document.getElementById('staffPwd').value = '';
  document.getElementById('adminUser').value = '';

function loadAllPartnerUDINs() {
  setSyncing(true);
  const partnerNames = Object.keys(CFG.partnerSheets);
  let loaded = 0;
  ALL_UDINS = {};
  UDINS = [];
  partnerNames.forEach(p => {
    loadPartnerUDINs(p, (rows) => {
      ALL_UDINS[p] = rows;
      UDINS = UDINS.concat(rows);
      loaded++;
      if (loaded === partnerNames.length) {
        setSyncing(false);
        setSlabel('Synced ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}));

}

// ══════════════════════════════════════════════════════
function loadReviewData(callback) {
  if (!CFG.reviewDataUrl) { if (callback) callback(); return; }
  fetch(CFG.reviewDataUrl + '&cachebust=' + Date.now())
    .then(r => r.text())
    .then(csv => {
      const parsed = Papa.parse(csv, { header: true, skipEmptyLines: true });
      SHEET_RD = {};
      parsed.data.forEach(r => {
        const udin = (r['UDIN'] || '').trim();
        if (!udin) return;
        SHEET_RD[udin] = {
          status:        r['Status']          || 'Pending',
          completedBy:   r['Completed By']    || '',
          completedDate: r['Completed Date']  || '',
          turnover:      r['Turnover']        || '',
          borrowings:    r['Borrowings']      || '',
          networth:      r['Networth']        || '',
          reviewRemarks: r['Review Remarks']  || '',
          items:         parseItems(r)
        };
        // Merge into local RD if not already present
        if (!RD[udin]) {
          RD[udin] = {
            items: SHEET_RD[udin].items,
            turnover: SHEET_RD[udin].turnover,
            borrowings: SHEET_RD[udin].borrowings,
            networth: SHEET_RD[udin].networth,
            completed: SHEET_RD[udin].status === 'Completed',
            completedBy: SHEET_RD[udin].completedBy,
            completedDate: SHEET_RD[udin].completedDate,
            reviewRemarks: SHEET_RD[udin].reviewRemarks
          };
        }
      });
      if (callback) callback();
    })
    .catch(() => { if (callback) callback(); });
}

function parseItems(row) {
  // Try to parse checklist items from sheet columns
  const items = {};
  let i = 0;
  Object.keys(row).forEach(k => {
    if (!['Sl.No','Partner','UDIN','Client Name','Turnover','Borrowings','Networth','Review Remarks','Status','Completed By','Completed Date','Last Modified By','Last Modified Date'].includes(k)) {
      const val = (row[k] || '').trim();
      if (val === 'Yes' || val === 'No' || val === 'NA') items[i] = val;
      i++;
    }
  });
  return items;
}

// ══════════════════════════════════════════════════════
// STATUS HELPERS
// ══════════════════════════════════════════════════════
function getStatus(udin) {
  // Sheet data takes priority
  if (SHEET_RD[udin] && SHEET_RD[udin].status && SHEET_RD[udin].status !== 'Pending') {
    return SHEET_RD[udin].status;
  }
  const rd = RD[udin];
  if (!rd) return 'Pending';
  if (rd.completed) return 'Completed';
  const hasAny = Object.keys(rd.items||{}).length > 0 || rd.turnover || rd.borrowings || rd.networth;
  return hasAny ? 'In Progress' : 'Pending';
}

function badge(s) {
  const c = { Pending:'b-pending', 'In Progress':'b-progress', Completed:'b-complete' };
  return `<span class="badge ${c[s]||'b-pending'}">${s}</span>`;
}

function inr(v) { return v ? '₹'+Number(v).toLocaleString('en-IN') : '—'; }

function fts(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+
           d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  } catch(e) { return iso; }
}

function isToday(dateStr) {
  if (!dateStr) return false;
  try {
    const today = new Date();
    const td = today.getDate(), tm = today.getMonth()+1, ty = today.getFullYear();
    // Handle Indian locale format: "12/6/2026, 7:23:41 PM" (DD/MM/YYYY)
    const match = String(dateStr).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (match) {
      const d = parseInt(match[1]), m = parseInt(match[2]), y = parseInt(match[3]);
      return d === td && m === tm && y === ty;
    }
    // Fallback for ISO format
    const d = new Date(dateStr);
    return d.getDate()===td && d.getMonth()+1===tm && d.getFullYear()===ty;
  } catch(e) { return false; }
}

// ══════════════════════════════════════════════════════
// METRICS CALCULATION
// ══════════════════════════════════════════════════════
function calcMetrics(udins) {
  const total     = udins.length;
  const completed = udins.filter(r => getStatus(r['UDIN']) === 'Completed').length;
  const inProgress= udins.filter(r => getStatus(r['UDIN']) === 'In Progress').length;
  const pending   = udins.filter(r => getStatus(r['UDIN']) === 'Pending').length;
  const doneToday = udins.filter(r => {
    const srd = SHEET_RD[r['UDIN']];
    if (srd && srd.completedDate) return isToday(srd.completedDate);
    const rd = RD[r['UDIN']];
    return rd && rd.completedDate && isToday(rd.completedDate);
  }).length;
  const pendingPct = total ? Math.round((pending/total)*100) : 0;
  return { total, completed, inProgress, pending, doneToday, pendingPct };
}

function openCL(udin)      { openChecklistPanel(udin, 'clarea',  false); }
function openAdminCL(udin) { openChecklistPanel(udin, 'adminCL', true);  }

function openChecklistPanel(udin, areaId, isAdmin) {
  const rec   = UDINS.find(r => r['UDIN'] === udin);
  if (!rec)   return;
  const tag      = String(rec['Peer Review Tagging']||'').trim();
  const items    = CHECKLISTS[tag]||[];
  const svcName  = TAG_NAMES[tag]||tag||rec['Sub-type']||'Unknown';

  if (!RD[udin]) RD[udin] = { items:{}, turnover:'', borrowings:'', networth:'', completed:false, completedDate:null, completedBy:'', reviewRemarks:'' };
  const rd = RD[udin];
  const srd = SHEET_RD[udin]||{};

  // Pre-fill from sheet if blank
  if (!rd.turnover   && (srd.turnover   || rec['Turnover']))   rd.turnover   = srd.turnover   || rec['Turnover'];
  if (!rd.borrowings && (srd.borrowings || rec['Borrowings'])) rd.borrowings = srd.borrowings || rec['Borrowings'];
  if (!rd.networth   && (srd.networth   || rec['Networth']))   rd.networth   = srd.networth   || rec['Networth'];
  if (!rd.reviewRemarks && srd.reviewRemarks) rd.reviewRemarks = srd.reviewRemarks;
  // Merge checklist items from sheet
  if (srd.items && Object.keys(srd.items).length && !Object.keys(rd.items).length) rd.items = srd.items;

  const pfx = isAdmin ? 'a' : '';

  function pct() {
    const marked = items.filter((_,i) => rd.items[i]).length;
    const finOk  = rd.turnover && rd.borrowings && rd.networth ? 1 : 0;
    return items.length ? Math.round(((marked+finOk)/(items.length+1))*100) : (finOk?100:0);
  }
  function canComplete() {
    return items.every((_,i) => rd.items[i]) && rd.turnover && rd.borrowings && rd.networth;
  }

  const area = document.getElementById(areaId);
  if (!area) return;

  area.innerHTML = `<div class="clpanel">
    <div class="clhead">
      <div class="clhinfo">
        <h3>${rec['Client Name']||''} — ${svcName}</h3>
        <p>UDIN: <span class="tmono">${udin}</span> &nbsp;·&nbsp; Partner: ${rec['Partner']||''} &nbsp;·&nbsp; ${rec['FY']||''} &nbsp;·&nbsp; Tag: <strong>${tag}</strong>${isAdmin?` &nbsp;·&nbsp; Staff: <strong>${rec['Staff']||'—'}</strong>`:''}</p>
      </div>
      <div class="clpct">
        <div class="clpbar"><div class="clpfill" id="${pfx}pfill" style="width:${pct()}%"></div></div>
        <span class="clpnum" id="${pfx}pnum">${pct()}%</span>
      </div>
    </div>
    <div class="cldetails">
      <div class="cldetail-item"><label>Client Name</label><span>${rec['Client Name']||'—'}</span></div>
      <div class="cldetail-item"><label>Sub-Type</label><span>${rec['Sub-type']||'—'}</span></div>
      <div class="cldetail-item"><label>Document Description</label><span style="font-size:12px">${rec['Document Description']||'—'}</span></div>
      <div class="cldetail-item"><label>Remarks</label><span style="font-size:12px">${rec['Remarks']||'—'}</span></div>
    </div>
    <div class="clbody">
      <div class="clsect">Financial Details — Verify &amp; Confirm (Mandatory)</div>
      <div class="fingrid">
        <div class="ffield"><label>Turnover (₹)</label><input type="number" id="${pfx}fT" value="${rd.turnover||''}" placeholder="Enter amount" oninput="updFin('${pfx}','turnover',this.value,'${udin}')"></div>
        <div class="ffield"><label>Borrowings (₹)</label><input type="number" id="${pfx}fB" value="${rd.borrowings||''}" placeholder="Enter amount" oninput="updFin('${pfx}','borrowings',this.value,'${udin}')"></div>
        <div class="ffield"><label>Networth (₹)</label><input type="number" id="${pfx}fN" value="${rd.networth||''}" placeholder="Enter amount" oninput="updFin('${pfx}','networth',this.value,'${udin}')"></div>
      </div>
      <div class="clsect">Checklist — ${svcName} (${items.length} items)</div>
      <div class="clitems">
        ${items.map((item,i) => `
        <div class="clitem" id="${pfx}ci${i}">
          <span class="clinum">${i+1}</span>
          <span class="cliname">${item}</span>
          <div class="clibtns">
            <button class="mbtn yes ${rd.items[i]==='Yes'?'on':''}" onclick="markItem('${pfx}',${i},'Yes','${udin}')">Yes</button>
            <button class="mbtn no ${rd.items[i]==='No'?'on':''}" onclick="markItem('${pfx}',${i},'No','${udin}')">No</button>
            <button class="mbtn na ${rd.items[i]==='NA'?'on':''}" onclick="markItem('${pfx}',${i},'NA','${udin}')">NA</button>
          </div>
        </div>`).join('')}
      </div>
    </div>
    <div style="padding:1rem 1.25rem;border-top:1px solid var(--border)">
      <div class="clsect">Review Remarks (Optional)</div>
      <textarea id="${pfx}remarks" rows="2" placeholder="Add any notes or remarks..." 
        style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--text);background:var(--surface);resize:vertical;font-family:'DM Sans',sans-serif"
        oninput="updRemarks('${pfx}',this.value,'${udin}')">${rd.reviewRemarks||''}</textarea>
    </div>
    <div class="clfooter">
      <div class="clfoot-left" id="${pfx}clstatus">${rd.completed?`Completed by <strong>${rd.completedBy}</strong> on ${fts(rd.completedDate)}`:'Fill all fields and mark all items to complete.'}</div>
      <div class="clfoot-right">
        <button class="btn" onclick="saveProgress('${udin}','${pfx}')">Save Progress</button>
        <button class="btn btn-green" id="${pfx}btnC" onclick="markComplete('${udin}','${pfx}')" ${canComplete()?'':'disabled'}>${rd.completed?'✓ Re-mark Complete':'Mark as Complete'}</button>
      </div>
    </div>
  </div>`;
  area.scrollIntoView({behavior:'smooth',block:'nearest'});
  pushAudit({action:'OPEN',udin,detail:`${CU.username} opened UDIN for review`,oldVal:'',newVal:''});
}

window.updFin = function(pfx, field, val, udin) {
  const old = RD[udin][field];
  RD[udin][field] = val;
  if (String(old) !== String(val)) pushAudit({action:'EDIT_FIN',udin,detail:`${CU.username} updated ${field}`,oldVal:old||'—',newVal:val||'—'});
  refreshCL(pfx, udin);
};

window.markItem = function(pfx, idx, val, udin) {
  const tag      = (UDINS.find(r=>r['UDIN']===udin)||{})['Peer Review Tagging']||'';
  const itemName = (CHECKLISTS[tag]||[])[idx]||'Item '+(idx+1);
  const old      = RD[udin].items[idx];
  RD[udin].items[idx] = val;
  if (old !== val) pushAudit({action:'MARK',udin,detail:`${CU.username} marked "${itemName}" as ${val}`,oldVal:old||'—',newVal:val});
  refreshCL(pfx, udin);
};

window.updRemarks = function(pfx, val, udin) {
  RD[udin].reviewRemarks = val;
};

window.saveProgress = function(udin, pfx) {
  RD[udin].savedBy = CU.username;
  RD[udin].savedAt = new Date().toISOString();
  saveLocal();
  pushSingleUDIN(udin);
  pushAudit({action:'SAVE',udin,detail:`${CU.username} saved progress`,oldVal:'',newVal:''});
  if (pfx==='a') drawAdminTable(); else drawTable();
  toast('Progress saved ✓');
};

window.markComplete = function(udin, pfx) {
  const was = RD[udin].completed;
  RD[udin].completed    = true;
  RD[udin].completedBy  = CU.username;
  RD[udin].completedDate= new Date().toISOString();
  saveLocal();
  pushSingleUDIN(udin);
  pushAudit({action:was?'RE_COMPLETE':'COMPLETE',udin,detail:`${CU.username} marked UDIN as complete`,oldVal:'',newVal:'Completed'});
  if (pfx==='a') drawAdminTable(); else drawTable();
  toast('UDIN marked as Completed ✓');
  const bc=document.getElementById(pfx+'btnC'); if(bc){bc.textContent='✓ Re-mark Complete';bc.disabled=false;}
  const cs=document.getElementById(pfx+'clstatus'); if(cs) cs.innerHTML=`Completed by <strong>${CU.username}</strong> on ${fts(new Date().toISOString())}`;
};

function refreshCL(pfx, udin) {
  const rd    = RD[udin];
  const tag   = (UDINS.find(r=>r['UDIN']===udin)||{})['Peer Review Tagging']||'';
  const items = CHECKLISTS[tag]||[];
  function pct() {
    const marked = items.filter((_,i)=>rd.items[i]).length;
    const finOk  = rd.turnover && rd.borrowings && rd.networth ? 1 : 0;
    return items.length ? Math.round(((marked+finOk)/(items.length+1))*100) : (finOk?100:0);
  }
  const pf=document.getElementById(pfx+'pfill'); if(pf) pf.style.width=pct()+'%';
  const pn=document.getElementById(pfx+'pnum');  if(pn) pn.textContent=pct()+'%';
  items.forEach((_,i) => {
    const ci=document.getElementById(pfx+'ci'+i); if(!ci) return;
    ci.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('on'));
    const v=rd.items[i]; if(v){const b=ci.querySelector('.mbtn.'+v.toLowerCase());if(b)b.classList.add('on');}
  });
  const bc=document.getElementById(pfx+'btnC');
  if(bc) bc.disabled=!(items.every((_,i)=>rd.items[i])&&rd.turnover&&rd.borrowings&&rd.networth);
}

// ══════════════════════════════════════════════════════
// PUSH SINGLE UDIN TO APPS SCRIPT
// ══════════════════════════════════════════════════════
function pushSingleUDIN(udin) {
  if (!CFG.appsScriptUrl) return;
  const rd  = RD[udin];
  const rec = UDINS.find(r => r['UDIN'] === udin)||{};
  const tag = String(rec['Peer Review Tagging']||'').trim();
  const checklistItems = CHECKLISTS[tag]||[];
  const itemMap = {};
  checklistItems.forEach((item,i) => { itemMap[item] = rd.items[i]||''; });

  const payload = {
    type:         'review_single',
    udin:         udin,
    slNo:         rec['Sl.No']||'',
    partner:      rec['Partner']||'',
    clientName:   rec['Client Name']||'',
    turnover:     rd.turnover||'',
    borrowings:   rd.borrowings||'',
    networth:     rd.networth||'',
    reviewRemarks:rd.reviewRemarks||'',
    items:        itemMap,
    tag:          tag,
    completed:    rd.completed||false,
    completedBy:  rd.completedBy||'',
    completedDate:rd.completedDate||'',
    savedBy:      rd.savedBy||'',
    savedAt:      rd.savedAt||''
  };

  fetch(CFG.appsScriptUrl, {
    method: 'POST',
    mode:   'no-cors',
    body:    JSON.stringify(payload),
    headers: {'Content-Type':'text/plain'}
  }).catch(()=>{});
}

// ══════════════════════════════════════════════════════
// AUDIT
// ══════════════════════════════════════════════════════
function pushAudit(entry) {
  if (!CFG.appsScriptUrl) return;
  entry.ts   = new Date().toISOString();
  entry.user = CU ? CU.username : 'system';
  AUDIT.unshift(entry);
  if (AUDIT.length > 200) AUDIT = AUDIT.slice(0,200);
  saveLocal();
  // Push audit to Apps Script
  fetch(CFG.appsScriptUrl, {
    method: 'POST',
    mode:   'no-cors',
    body:    JSON.stringify({ type:'audit', entry }),
    headers: {'Content-Type':'text/plain'}
  }).catch(()=>{});
}

// ══════════════════════════════════════════════════════
// LOCAL STORAGE
// ══════════════════════════════════════════════════════
function saveLocal() {
  try {
    localStorage.setItem('ycrj_rd', JSON.stringify(RD));
    localStorage.setItem('ycrj_al', JSON.stringify(AUDIT));
  } catch(e) {}
}

// ══════════════════════════════════════════════════════
// SEND REPORTS
// ══════════════════════════════════════════════════════
async function sendReports() {
  if (!CFG.appsScriptUrl) { showSlog('Apps Script URL not configured. Go to Setup tab.','err'); return; }
  const btn = document.getElementById('btnSend');
  btn.disabled=true; btn.textContent='Sending...';
  const today    = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const payload  = PARTNERS.map(p => {
    const pu = UDINS.filter(r => r['Partner'] === p.name);
    const m  = calcMetrics(pu);
    return { name:p.name, email:p.email, date:today, ...m };
  });
  try {
    await fetch(CFG.appsScriptUrl, {
      method:'POST', mode:'no-cors',
      body: JSON.stringify({type:'email', partners:payload, firm:CFG.firm, sender:CFG.sender}),
      headers:{'Content-Type':'text/plain'}
    });
    showSlog('✓ Reports sent to all partners.','ok');
    pushAudit({action:'EMAIL_SENT',udin:'',detail:`End-of-day reports sent by ${CU.username}`,oldVal:'',newVal:''});
    toast('Reports sent!');
  } catch(e) { showSlog('✗ Error: '+e.message,'err'); }
  btn.disabled=false; btn.textContent='Send to All Partners';
}

function showSlog(msg,type) {
  const el=document.getElementById('slog'); if(!el) return;
  el.textContent=msg; el.className='slog '+type; el.style.display='block';
}
